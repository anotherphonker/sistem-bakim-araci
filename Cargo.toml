[package]
name = "sistem-bakim-araci"
version = "0.1.0"
edition = "2021"
description = "Sistem Bakım Aracı - Windows bakım/onarım GUI (Rust + egui). Tek .exe."
authors = ["Sen"]

[[bin]]
name = "SistemBakimAraci"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
